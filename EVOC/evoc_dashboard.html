<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EVoC Drilldown Dashboard</title>
  <style>
    body{font-family:Inter,Arial;margin:12px}
    .row{display:flex;gap:12px}
    .panel{border:1px solid #ddd;padding:12px;border-radius:6px;background:#fff}
    #results{width:48%}
    #details{width:48%;overflow:auto;max-height:80vh}
    .cluster{padding:8px;border-bottom:1px solid #f0f0f0}
    .cluster h4{margin:0 0 6px 0}
    button{padding:6px 10px}
    pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <h3>EVoC Drilldown Dashboard</h3>
  <div style="margin-bottom:10px">
    <input id="query" placeholder="Search query" style="width:60%" />
    <button id="go">Search</button>
    <label style="margin-left:12px">Top K: <input id="top_k" value="5" style="width:50px"/></label>
  </div>

  <div class="row">
    <div id="results" class="panel">
      <h4>Search Results</h4>
      <div id="list"></div>
    </div>

    <div id="details" class="panel">
      <h4>Cluster Details</h4>
      <div id="meta"></div>
      <div id="cluster_content"></div>
    </div>
  </div>

<script>
async function postJSON(url, body){
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return await res.json();
}

async function getJSON(url){
  const res = await fetch(url);
  return await res.json();
}

function renderList(items){
  const el = document.getElementById('list'); el.innerHTML='';
  items.forEach((it, idx)=>{
    const div = document.createElement('div'); div.className='cluster';
    const title = document.createElement('h4'); title.textContent = `${idx+1}. ${it.topic} (${it.size})`;
    div.appendChild(title);
    const meta = document.createElement('div'); meta.textContent = `sim=${it.similarity.toFixed(3)} depth=${it.depth}`;
    div.appendChild(meta);
    const btn = document.createElement('button'); btn.textContent='Inspect'; btn.onclick=()=>showCluster(it);
    div.appendChild(btn);
    el.appendChild(div);
  })
}

function showCluster(it){
  const cont = document.getElementById('cluster_content'); cont.innerHTML='';
  const h = document.createElement('h4'); h.textContent = `${it.topic} — ${it.size} docs`; cont.appendChild(h);
  const p = document.createElement('pre'); p.textContent = it.sentences.slice(0,50).join('\n\n'); cont.appendChild(p);
  if(it.has_stance_split){
    const s = document.createElement('div'); s.innerHTML = `<strong>Stance split</strong> (see console for full arrays)`; cont.appendChild(s);
    console.log('Stance sides', it.stance_sides);
  }
}

document.getElementById('go').onclick = async ()=>{
  const q = document.getElementById('query').value; const top_k = parseInt(document.getElementById('top_k').value || '5');
  if(!q) return alert('enter a query');
  const res = await postJSON('/api/search', {query: q, top_k: top_k});
  renderList(res);
};

(async function init(){
  try{
    const meta = await getJSON('/api/meta');
    document.getElementById('meta').textContent = `Layers: ${meta.layer_count}`;
  }catch(err){
    document.getElementById('meta').textContent = 'Failed to load meta: '+err;
  }
})();
</script>
</body>
</html>
